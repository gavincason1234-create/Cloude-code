name: Site CI — check, build, end-to-end

# Runs the site's own checks, builds it, then drives it with Playwright in memory mode
# on a phone-sized and a laptop-sized browser. Nightly, on demand, and on every push to main.
on:
  workflow_dispatch:
  schedule:
    # 3 AM Central (08:00 UTC; 09:00 UTC would match winter — good enough for a nightly).
    - cron: "0 8 * * *"
  push:
    branches: [main]

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: check · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 1
      # The site checkout lives inside the workspace for this run.
      SITE_DIR: ./site
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out this harness
        uses: actions/checkout@v4

      - name: Check out the site
        uses: actions/checkout@v4
        with:
          repository: gavincason1234-create/Grandmas-trucklot-website-
          # SITE_REPO_TOKEN: a fine-grained personal access token with read-only "Contents"
          # access to the private site repo. Settings → Secrets and variables → Actions.
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site

      - name: pnpm
        uses: pnpm/action-setup@v4
        # version comes from packageManager in package.json; setting both makes the action fail

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            site/pnpm-lock.yaml

      - name: Install harness dependencies
        run: pnpm install --frozen-lockfile

      - name: Install site dependencies
        run: pnpm site:install

      - name: Site checks (typecheck, lint, unit tests)
        run: pnpm site:check

      - name: Build the site
        run: pnpm site:build

      - name: Install Chromium for Playwright
        # The runner has no browser; this fetches the revision that matches @playwright/test.
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e
        env:
          SKIP_BUILD: 1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore
